# =============================================================================
# RIPPLE - Conda Environment Configuration (GPU Mode)
# =============================================================================
# Minimal conda environment: Python runtime + ffmpeg only.
# Heavy Python packages (PyTorch, TensorFlow, etc.) are installed once via
# requirements/requirements-gpu.txt in quickstart.sh step 5.
#
# Installation:
#   bash quickstart.sh
#   # or manually:
#   conda env create -f conda/environment.yml -n ripple-env
#   conda activate ripple-env
#   pip install -r requirements/requirements-gpu.txt
#
# For CPU-only systems, use environment-cpu.yml instead.
# =============================================================================

name: ripple-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip>=25.0
  - ffmpeg>=6.0
  - setuptools>=80.0
  - wheel>=0.45

variables:
  RIPPLE_ENV: "conda"
  RIPPLE_MODE: "gpu"
