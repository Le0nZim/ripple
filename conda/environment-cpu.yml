# =============================================================================
# RIPPLE - Conda Environment Configuration (CPU Only)
# =============================================================================
# Minimal conda environment: Python runtime + ffmpeg only.
# Heavy Python packages are installed once via requirements/requirements-cpu.txt
# in quickstart.sh step 5.
#
# Installation:
#   bash quickstart.sh
#   # or manually:
#   conda env create -f conda/environment-cpu.yml -n ripple-env
#   conda activate ripple-env
#   pip install -r requirements/requirements-cpu.txt
#
# Note: GPU features (RAFT, LocoTrack) are NOT available in CPU mode.
# =============================================================================

name: ripple-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip>=25.0
  - ffmpeg>=6.0
  - setuptools>=80.0
  - wheel>=0.45

variables:
  RIPPLE_ENV: "conda"
  RIPPLE_MODE: "cpu"
